<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼豆图纸工作台 · 图片转拼豆像素图案与色号</title>
<meta name="description" content="上传图片，自动转换成彩色拼豆像素图案，逐格标注色号，生成配色清单与可打印的 A4 分块图纸。全程在浏览器本地处理，图片不上传。">
<meta name="color-scheme" content="light">
<!-- 字体：本产物默认请求 Google Fonts（fonts.googleapis.com / fonts.gstatic.com），这是整份产物唯一的外部请求。
     断网时只影响字体排版，功能与导出不受影响；需要完全离线请用 PD_OFFLINE=1 node scripts/build.mjs 重新构建。 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   拼豆图纸工作台 · 样式
   视觉方向：手作桌面 / 拼豆工作台
   米白纸底、低饱和 UI、唯一的高饱和来源是拼豆本身的颜色。
   ========================================================================== */

:root {
  --paper: #f7f4ec;
  --paper-deep: #efeade;
  --card: #ffffff;
  --ink: #2b2622;
  --ink-2: #6b645b;
  --ink-3: #9c948a;
  --line: rgba(43, 38, 34, 0.11);
  --line-2: rgba(43, 38, 34, 0.2);
  --accent: #e2574c;
  --accent-deep: #c8433a;
  --accent-soft: rgba(226, 87, 76, 0.1);
  --ok: #3b6d11;
  --r-sm: 7px;
  --r: 10px;
  --r-lg: 14px;
  --shadow: 0 1px 2px rgba(43, 38, 34, 0.05), 0 6px 18px -8px rgba(43, 38, 34, 0.18);
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-disp: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* 应用自己管滚动，页面级不滚 */
body { overflow: hidden; }

body {
  background-image:
    radial-gradient(circle at 1px 1px, rgba(43, 38, 34, 0.055) 1px, transparent 0);
  background-size: 22px 22px;
}

#root { height: 100%; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(43, 38, 34, 0.16);
  border-radius: 8px;
  border: 3px solid var(--paper);
}
::-webkit-scrollbar-thumb:hover { background: rgba(43, 38, 34, 0.3); }
/* 侧栏滚动条：底色是卡片白，边框要跟着改成白，否则会出现一圈纸色描边 */
.pd-panel-body::-webkit-scrollbar-thumb { border-color: #fff; }
.pd-panel-body::-webkit-scrollbar-thumb:hover { background: rgba(43, 38, 34, 0.34); }

/* ---------------------------------------------------------------- 布局 */

.pd-app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

.pd-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  z-index: 20;
}

.pd-brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.pd-brand-mark {
  width: 13px; height: 13px; border-radius: 3px; align-self: center;
  background: linear-gradient(135deg, var(--accent) 0 50%, var(--ink) 50% 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
}
.pd-brand-name { font-family: var(--font-disp); font-size: 17px; letter-spacing: 0.5px; }
.pd-brand-sub { font-size: 11.5px; color: var(--ink-3); }
.pd-top-dim { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding-right: 4px; }
.pd-spacer { flex: 1; }

.pd-main { flex: 1; display: flex; min-height: 0; overflow: hidden; }
.pd-center { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px; overflow: hidden; }

.pd-panel {
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.pd-panel-left { flex: 0 0 306px; margin: 14px 0 14px 14px; border-radius: var(--r-lg); }
.pd-panel-right { flex: 0 0 320px; margin: 14px 14px 14px 0; border-radius: var(--r-lg); }

.pd-panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
  font-weight: 500; font-size: 13.5px;
  background: linear-gradient(#fff, #fcfaf5);
  flex: 0 0 auto;
  z-index: 3;
}

/* 面板滚动容器：左右面板共用，竖向滚轮 / 触摸板横纵滑动 / Shift+滚轮 / 中键拖拽都能滚 */
.pd-panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y;
}

/* 面板内的固定区（头部、统计、工具条、底部栏）不许被压扁或跟着滚 */
.pd-panel > .pd-panel-head,
.pd-panel > .pd-stats,
.pd-panel > .pd-tools,
.pd-panel > .pd-right-foot { flex: 0 0 auto; }
.pd-panel-close { display: none; border: 0; background: transparent; padding: 4px; cursor: pointer; color: var(--ink-2); }

.pd-panel-left > .pd-sec:last-child { border-bottom: 0; }

/* ---------------------------------------------------------------- 折叠段 */

.pd-sec { border-bottom: 1px solid var(--line); }
.pd-sec-head {
  width: 100%; display: flex; align-items: center; gap: 7px;
  padding: 11px 14px; background: transparent; border: 0; cursor: pointer;
  color: var(--ink); font-weight: 500; text-align: left;
}
.pd-sec-head:hover { background: rgba(43, 38, 34, 0.025); }
.pd-sec-head .pd-caret { color: var(--ink-3); transition: transform 0.16s ease; }
.pd-sec.is-open .pd-sec-head .pd-caret { transform: rotate(180deg); }
.pd-sec-body { padding: 2px 14px 15px; display: flex; flex-direction: column; gap: 11px; }

/* ---------------------------------------------------------------- 控件 */

.pd-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 11px; min-height: 32px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: #fff; color: var(--ink);
  cursor: pointer; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
}
.pd-btn:hover:not(:disabled) { background: var(--paper-deep); border-color: rgba(43, 38, 34, 0.3); }
.pd-btn:active:not(:disabled) { transform: translateY(1px); }
.pd-btn:disabled { opacity: 0.42; cursor: not-allowed; }
.pd-btn.is-full { width: 100%; }
.pd-btn.is-active { background: var(--accent-soft); border-color: rgba(226, 87, 76, 0.45); color: var(--accent-deep); }
.pd-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pd-btn-primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); }
.pd-btn-ghost { border-color: transparent; background: transparent; }
.pd-btn-ghost:hover:not(:disabled) { background: rgba(43, 38, 34, 0.06); }
.pd-ico { flex: 0 0 auto; }

.pd-label { font-size: 12.5px; color: var(--ink-2); }
.pd-dim { font-size: 11.5px; color: var(--ink-3); font-family: var(--font-mono); }
.pd-note { font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }
.pd-field { display: flex; flex-direction: column; gap: 6px; }
.pd-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pd-divider { height: 1px; background: var(--line); margin: 4px 0; }
.pd-divider-v { width: 1px; align-self: stretch; background: var(--line); margin: 0 3px; }

.pd-seg {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--paper-deep); border-radius: var(--r-sm); border: 1px solid var(--line);
  width: fit-content; max-width: 100%; flex-wrap: wrap;
}
.pd-seg-item {
  flex: 1 1 auto; padding: 5px 9px; border: 0; border-radius: 5px;
  background: transparent; cursor: pointer; color: var(--ink-2);
  font-size: 12.5px; white-space: nowrap; transition: background 0.12s, color 0.12s;
}
.pd-seg-item:hover { color: var(--ink); }
.pd-seg-item.is-on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(43, 38, 34, 0.12); font-weight: 500; }
.pd-seg.is-dense .pd-seg-item { padding: 4px 8px; font-size: 12px; }

.pd-slider { display: flex; flex-direction: column; gap: 4px; }
.pd-slider.is-disabled { opacity: 0.45; }
.pd-slider-head { display: flex; justify-content: space-between; align-items: baseline; }
.pd-val { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 20px; background: transparent; cursor: pointer; margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 3px; background: var(--line-2);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%; margin-top: -5.5px;
  background: #fff; border: 1.5px solid var(--accent);
  box-shadow: 0 1px 3px rgba(43, 38, 34, 0.28);
}
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line-2); }
input[type="range"]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: #fff;
  border: 1.5px solid var(--accent); box-shadow: 0 1px 3px rgba(43, 38, 34, 0.28);
}

.pd-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.pd-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.pd-switch {
  flex: 0 0 auto; width: 30px; height: 18px; border-radius: 999px;
  background: rgba(43, 38, 34, 0.18); position: relative; transition: background 0.16s;
}
.pd-switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.28); transition: transform 0.16s;
}
.pd-toggle input:checked + .pd-switch { background: var(--accent); }
.pd-toggle input:checked + .pd-switch::after { transform: translateX(12px); }
.pd-toggle:hover .pd-switch { background: rgba(43, 38, 34, 0.28); }
.pd-toggle input:checked ~ .pd-switch { background: var(--accent); }

.pd-num { display: flex; flex-direction: column; gap: 4px; }
.pd-num-box {
  display: flex; align-items: center; gap: 3px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm); background: #fff; padding: 0 8px;
}
.pd-num-box input {
  width: 100%; border: 0; outline: 0; padding: 6px 0; background: transparent;
  font-family: var(--font-mono); font-size: 13px;
}
.pd-num-box em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }

.pd-select, .pd-textarea {
  width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: #fff; padding: 7px 9px; outline: 0;
}
.pd-select:focus, .pd-textarea:focus { border-color: var(--accent); }
.pd-textarea { min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; }
.pd-presets { display: flex; gap: 6px; }
.pd-preset {
  flex: 1; padding: 6px 0; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: #fff; cursor: pointer; font-size: 12.5px; color: var(--ink-2);
}
.pd-preset:hover { background: var(--paper-deep); }
.pd-preset.is-on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }

/* ---------------------------------------------------------------- 原图缩略 */

.pd-focus { display: flex; flex-direction: column; gap: 7px; }
.pd-focus-canvas {
  width: 100%; display: block; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); cursor: crosshair;
  background: var(--paper-deep);
}
.pd-focus-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------------------------------------------------------------- 舞台 */

.pd-stage {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden;
}
.pd-stage-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-bottom: 1px solid var(--line);
  background: linear-gradient(#fff, #fcfaf5); flex: 0 0 auto;
}
.pd-zoom { display: flex; align-items: center; gap: 5px; }
.pd-zoom-val {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2);
  min-width: 44px; text-align: center;
}
.pd-hoverinfo {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2);
  background: var(--paper-deep); padding: 3px 9px; border-radius: 999px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
}
.pd-canvas-wrap {
  flex: 1; min-height: 0; overflow: auto; position: relative;
  display: flex; align-items: flex-start; justify-content: safe center;
  background-color: #fff;
  background-image:
    linear-gradient(rgba(43, 38, 34, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(43, 38, 34, 0.035) 1px, transparent 1px);
  background-size: 20px 20px;
  padding: 14px;
}
.pd-canvas { display: block; flex: 0 0 auto; touch-action: none; }
.pd-bar-sep { width: 1px; height: 18px; background: var(--line); flex: 0 0 auto; margin: 0 2px; }

.pd-loupe {
  position: absolute; z-index: 12; pointer-events: none;
  background: #fff; border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: 0 6px 22px -6px rgba(43, 38, 34, 0.4);
  overflow: hidden;
}
.pd-loupe canvas { display: block; }
.pd-loupe-foot {
  padding: 5px 8px; border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-2);
  background: #fcfaf5; white-space: nowrap;
}

.pd-busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, 0.72); z-index: 14; }
.pd-busy-inner {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 16px; box-shadow: var(--shadow); font-size: 12.5px; color: var(--ink-2);
}
.pd-bar { width: 92px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.pd-bar i { display: block; height: 100%; background: var(--accent); transition: width 0.15s; }

.pd-spinner {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--line-2); border-top-color: var(--accent);
  animation: pd-spin 0.7s linear infinite; display: inline-block; flex: 0 0 auto;
}
@keyframes pd-spin { to { transform: rotate(360deg); } }

.pd-loading {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--ink-2); font-size: 13px;
}

/* ---------------------------------------------------------------- 右侧 */

.pd-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--line); border-bottom: 1px solid var(--line);
}
.pd-stat { background: #fdfcf8; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; }
.pd-stat-label { font-size: 11.5px; color: var(--ink-3); }
.pd-stat-row { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.pd-stat-value { font-family: var(--font-mono); font-size: 17px; font-weight: 500; letter-spacing: -0.3px; white-space: nowrap; }
.pd-stat-sub { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pd-tools { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.pd-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.pd-right-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; background: #fdfcf8; }
.pd-empty { padding: 22px 16px; color: var(--ink-3); font-size: 12.5px; line-height: 1.7; }

.pd-colors { padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.pd-color {
  display: grid;
  grid-template-columns: 18px 22px auto 1fr auto auto auto;
  align-items: center; gap: 7px;
  padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer;
  transition: background 0.12s;
}
.pd-color:hover { background: rgba(43, 38, 34, 0.05); }
.pd-color.is-active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(226, 87, 76, 0.35); }
.pd-color.is-done { opacity: 0.5; }
.pd-color.is-done .pd-color-code, .pd-color.is-done .pd-color-name { text-decoration: line-through; }
.pd-color-done {
  width: 18px; height: 18px; padding: 0; border-radius: 5px;
  border: 1px solid var(--line-2); background: #fff; cursor: pointer;
  display: grid; place-items: center; color: transparent;
}
.pd-color-done.is-on { background: var(--ok); border-color: var(--ok); color: #fff; }
.pd-swatch {
  width: 20px; height: 20px; border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16), inset 0 0 0 4px rgba(255, 255, 255, 0.4);
  position: relative;
}
.pd-swatch::after {
  content: ""; position: absolute; inset: 38%; border-radius: 50%;
  background: rgba(255, 255, 255, 0.55); mix-blend-mode: soft-light;
}
.pd-color-code { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.pd-color-name { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pd-color-n { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.pd-color-pct { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); width: 42px; text-align: right; }
.pd-color-bag { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); width: 30px; text-align: right; }

/* ------------------------------------------------- 空状态入口卡（原欢迎页已去掉） */

.pd-entry { flex: 1; display: grid; place-items: center; padding: 22px; overflow: auto; }
.pd-entry-card {
  width: min(460px, 100%); background: var(--card);
  border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: 22px 24px 20px;
}
.pd-entry-mark { display: flex; gap: 5px; margin-bottom: 14px; }
.pd-entry-mark span {
  width: 15px; height: 15px; border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
  animation: pd-pop 0.5s cubic-bezier(0.2, 1.2, 0.4, 1) backwards;
}
.pd-entry-mark span:nth-child(1) { animation-delay: 0.02s; }
.pd-entry-mark span:nth-child(2) { animation-delay: 0.07s; }
.pd-entry-mark span:nth-child(3) { animation-delay: 0.12s; }
.pd-entry-mark span:nth-child(4) { animation-delay: 0.17s; }
.pd-entry-mark span:nth-child(5) { animation-delay: 0.22s; }
.pd-entry-mark span:nth-child(6) { animation-delay: 0.27s; }
@keyframes pd-pop { from { opacity: 0; transform: translateY(9px) scale(0.7); } }

.pd-entry-title {
  font-family: var(--font-disp); font-size: 20px; font-weight: 400;
  margin: 0 0 8px; letter-spacing: 0.5px; line-height: 1.35;
}
.pd-entry-lead { color: var(--ink-2); font-size: 12.5px; margin: 0 0 16px; line-height: 1.75; }
.pd-entry-actions { display: flex; gap: 9px; margin-bottom: 12px; }
.pd-entry-url { display: flex; gap: 7px; }
.pd-entry-url input {
  flex: 1; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 8px 11px; outline: 0; background: #fff; min-width: 0;
}
.pd-entry-url input:focus { border-color: var(--accent); }
.pd-entry-err { color: var(--danger, #a32d2d); font-size: 12.5px; margin-top: 10px; }
.pd-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }

/* ---------------------------------------------------------------- 覆盖层 */

.pd-toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: rgba(43, 38, 34, 0.94); color: #fff;
  padding: 9px 16px; border-radius: 999px; font-size: 12.5px;
  z-index: 60; box-shadow: 0 8px 26px -8px rgba(0, 0, 0, 0.5);
  animation: pd-rise 0.22s ease-out;
  max-width: 80vw; text-align: center;
}
@keyframes pd-rise { from { opacity: 0; transform: translate(-50%, 12px); } }

.pd-error {
  position: fixed; left: 50%; top: 70px; transform: translateX(-50%);
  background: #fcebeb; border: 1px solid #f09595; color: #791f1f;
  padding: 9px 16px; border-radius: var(--r); font-size: 12.5px; z-index: 60;
}

.pd-dropveil {
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center;
  background: rgba(247, 244, 236, 0.86); backdrop-filter: blur(2px);
}
.pd-dropveil > div {
  border: 2px dashed var(--accent); border-radius: 18px;
  padding: 34px 54px; font-family: var(--font-disp); font-size: 20px; color: var(--accent);
  background: rgba(255, 255, 255, 0.8);
}

.pd-drawer-btn { display: none; }

/* ---------------------------------------------------------------- 状态提示 */

/* 顶栏「网格已锁定」标记 */
.pd-lock-flag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--paper); border: 1px solid var(--line-2);
  color: var(--ink-2); font-size: 11.5px; white-space: nowrap;
}
.pd-lock-flag .pd-ico { color: var(--accent); flex: 0 0 auto; }

/* 参数面板里的锁定说明 */
.pd-lock-note {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 7px 10px; border-radius: var(--r-sm);
  background: var(--paper); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  color: var(--ink-2); font-size: 11.5px; line-height: 1.6;
}
.pd-lock-note .pd-ico { color: var(--accent); margin-top: 2px; flex: 0 0 auto; }

/* 「原图不在存档中」提示（左侧面板） */
.pd-archive-note {
  margin: 10px 12px 0; padding: 7px 10px; border-radius: var(--r-sm);
  background: var(--paper); border: 1px dashed var(--line-2);
  color: var(--ink-2); font-size: 11.5px; line-height: 1.55;
}

/* 同一提示在舞台上方常驻一份，窄屏（左面板收进抽屉）也看得见 */
.pd-center-note {
  flex: 0 0 auto; margin-bottom: 8px; padding: 7px 11px;
  border-radius: var(--r-sm);
  background: var(--paper); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  color: var(--ink-2); font-size: 11.5px; line-height: 1.5;
}

/* ---------------------------------------------------------------- 响应式 */

@media (max-width: 1180px) {
  .pd-panel-left { flex-basis: 274px; }
  .pd-panel-right { flex-basis: 286px; }
  .pd-color-pct { display: none; }
  .pd-color { grid-template-columns: 18px 22px auto 1fr auto auto; }
}

@media (max-width: 980px) {
  /* 窄屏：右面板改成可切换的浮层抽屉，默认隐藏，由顶栏「配色」按钮打开 */
  .pd-panel-right {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 42;
    width: min(330px, 88vw); margin: 0; border-radius: 0;
    transform: translateX(102%);
    visibility: hidden;
    transition: transform 0.22s ease, visibility 0s linear 0.22s;
    box-shadow: -12px 0 34px -16px rgba(43, 38, 34, 0.5);
  }
  .pd-panel-right.is-open {
    transform: none;
    visibility: visible;
    transition: transform 0.22s ease, visibility 0s;
  }
  .pd-panel-right .pd-panel-close { display: inline-flex; }
  .pd-main { flex-direction: column; }
  .pd-drawer-btn { display: inline-flex; }
  .pd-brand-sub { display: none; }
}

@media (max-width: 760px) {
  .pd-panel-left {
    position: fixed; inset: 0 auto 0 0; z-index: 40; width: 300px; margin: 0;
    border-radius: 0; transform: translateX(-102%); transition: transform 0.22s ease;
  }
  .pd-panel-left.is-open { transform: none; }
  .pd-panel-close { display: inline-flex; }
  .pd-center { padding: 8px; }
  /* 窄屏多了「配色」按钮，顶栏允许换行，避免挤出屏幕 */
  .pd-top { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
  .pd-brand-name { font-size: 15px; }
  /* 锁定标记只留图标（title 仍有完整说明） */
  .pd-lock-flag { padding: 3px 7px; }
  .pd-lock-flag-label { display: none; }
}

/* ---------------------------------------------------------------- 打印 */

.pd-print { display: none; }

@media print {
  body { background: #fff !important; background-image: none !important; }
  #root > .pd-app { display: none !important; }
  .pd-print { display: block !important; }
  .pd-print-page {
    width: 100%;
    page-break-after: always;
    break-after: page;
    display: block;
  }
  .pd-print-page:last-child { page-break-after: auto; break-after: auto; }
  .pd-print-page img { width: 100%; height: auto; display: block; }
}
